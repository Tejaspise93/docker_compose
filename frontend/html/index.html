<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Docker Compose Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Docker Compose Learning Project</h1>
    <p>Static page served by nginx. Buttons below call the backend through nginx's reverse proxy.</p>

    <button onclick="checkHealth()">Check Health</button>
    <button onclick="getMessage()">Get Message</button>
    <button onclick="getSecret()">Get Secret</button>

    <pre id="output">Response will appear here...</pre>
  </div>

  <script>
    async function callApi(endpoint) {
      const output = document.getElementById('output');
      output.textContent = 'Loading...';
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        output.textContent = `HTTP ${res.status}\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        output.textContent = `Request failed: ${err.message}`;
      }
    }

    const checkHealth = () => callApi('/api/health');
    const getMessage = () => callApi('/api/message');
    const getSecret = () => callApi('/api/secret');
  </script>
</body>

</html>
